<html><body style="font-family: -apple-system, Helvetica; font-size: 13px;">
<h2>JamfEA-Kit</h2>
<p>A ready to use kit of Jamf Pro Extension Attribute scripts plus the <code>jamfea</code> command line tool.</p>
<p>This installs:</p>
<ul>
<li><code>/usr/local/bin/jamfea</code></li>
<li>EA scripts in <code>/usr/local/share/jamfea-kit/eas</code></li>
<li>Jamf importable XML and JSON in <code>/usr/local/share/jamfea-kit/export</code></li>
</ul>
</body></html>
